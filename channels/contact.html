<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact form for Brendan Vogel portfolio.">
  <title>Brendan Vogel | Contact</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <h1 class="site-title">Contact</h1>
      <p class="site-subtitle">Send a message and see recent submission history.</p>
      <div class="nav-wrap">
        <nav class="primary-nav" aria-label="Main navigation">
          <a class="nav-link" data-nav-link href="../index.html">Home</a>
          <a class="nav-link" data-nav-link href="project_resume.html">Resume</a>
          <a class="nav-link" data-nav-link href="project_hobbies.html">Hobbies</a>
          <a class="nav-link" data-nav-link href="project_about.html">About</a>
          <a class="nav-link" data-nav-link href="contact.html">Contact</a>
        </nav>
      </div>
    </div>
  </header>

  <main class="page">
    <section class="panel" aria-labelledby="contact-form-heading">
      <h2 id="contact-form-heading">Contact Form</h2>
      <form class="form-grid" data-contact-form novalidate>
        <div class="form-group">
          <label for="name">Name</label>
          <input id="name" name="name" type="text" autocomplete="name" required>
          <p class="error" data-error-for="name"></p>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
          <p class="error" data-error-for="email"></p>
        </div>

        <div class="form-group full">
          <label for="topic">Topic</label>
          <select id="topic" name="topic" required>
            <option value="">Choose a topic</option>
            <option value="project">Project Opportunity</option>
            <option value="internship">Internship / Role</option>
            <option value="networking">Networking</option>
          </select>
          <p class="error" data-error-for="topic"></p>
        </div>

        <div class="form-group full">
          <label for="message">Message</label>
          <textarea id="message" name="message" required></textarea>
          <p class="error" data-error-for="message"></p>
        </div>

        <div class="form-group full">
          <button class="btn" type="submit">Submit Message</button>
          <p class="success-box" data-form-status></p>
        </div>
      </form>
    </section>

    <section class="panel" aria-labelledby="recent-submissions-heading">
      <h2 id="recent-submissions-heading">Recent Submissions</h2>
      <p>Submissions are stored in localStorage for this browser session history.</p>
      <ul class="submission-list" data-recent-submissions>
        <li class="submission-item">No messages submitted yet.</li>
      </ul>
    </section>
  </main>

  <footer class="site-footer">
    <div class="site-footer-inner">
      <p>Personal Portfolio</p>
      <p>&copy; <span data-year></span> Brendan Vogel</p>
    </div>
  </footer>

  <script src="../scripts/app.js"></script>
  <script src="../scripts/contact.js"></script>
</body>
</html>
